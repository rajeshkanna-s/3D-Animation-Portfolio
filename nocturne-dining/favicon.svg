<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B83A14" />
      <stop offset="50%" stop-color="#E58E37" />
      <stop offset="100%" stop-color="#FFA439" />
    </linearGradient>
    <radialGradient id="hearthBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A100A" />
      <stop offset="100%" stop-color="#080503" />
    </radialGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E58E37" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#hearthBg)" stroke="#E58E37" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Living Woodfire Flame & Michelin Star Spark -->
  <g filter="url(#flameGlow)">
    <!-- Outer Ember Flame Curve -->
    <path d="M50 16 C50 16 64 32 64 50 C64 66 54 78 50 82 C46 78 36 66 36 50 C36 38 44 26 50 16 Z" fill="url(#fireGrad)" />
    <!-- Inner Radiant Core -->
    <path d="M50 38 C54 44 56 50 56 58 C56 66 52 72 50 74 C48 72 44 66 44 58 C44 52 46 44 50 38 Z" fill="#FFE2A8" />
    <!-- Floating Ember Sparks -->
    <circle cx="68" cy="32" r="2" fill="#FFA439" />
    <circle cx="32" cy="40" r="1.5" fill="#FFA439" />
    <circle cx="50" cy="18" r="1.5" fill="#FFE2A8" />
  </g>
</svg>
