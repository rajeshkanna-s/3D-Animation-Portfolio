<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cacaoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="50%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#8C5835" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241710" />
      <stop offset="100%" stop-color="#0E0805" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4A373" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Base Shield/Hexagon -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#bgGrad)" stroke="#D4A373" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Stylized Cacao / Monogram V -->
  <g filter="url(#goldGlow)">
    <!-- Molten Drop / Cacao Pod Shape -->
    <path d="M50 16 C34 28 26 44 26 58 C26 72 36 82 50 82 C64 82 74 72 74 58 C74 44 66 28 50 16 Z" fill="none" stroke="url(#cacaoGrad)" stroke-width="3" />
    
    <!-- Central Luxury V Monogram -->
    <path d="M38 38 L50 66 L62 38" fill="none" stroke="url(#cacaoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Golden Core Spark -->
    <circle cx="50" cy="30" r="3" fill="#E5C378" />
  </g>
</svg>
