<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="roastRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C6C" />
      <stop offset="50%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="steamCream" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="50%" stop-color="#FFB4A2" />
      <stop offset="100%" stop-color="#FFF3E4" />
    </linearGradient>
    <radialGradient id="roastBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#261715" />
      <stop offset="70%" stop-color="#150E0C" />
      <stop offset="100%" stop-color="#0A0605" />
    </radialGradient>
    <filter id="roastGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E63946" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with Crimson Rim -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#roastBg)" stroke="url(#roastRed)" stroke-width="2.5" />

  <!-- Kinetic Coffee Cup & Hero Energy Steam -->
  <g filter="url(#roastGlow)">
    <!-- Coffee Cup Body -->
    <path d="M28 44 L32 72 C33 77 38 81 44 81 L56 81 C62 81 67 77 68 72 L72 44 Z" fill="url(#roastRed)" />
    
    <!-- Cup Rim Oval -->
    <ellipse cx="50" cy="44" rx="22" ry="5.5" fill="#FFF3E4" />
    <!-- Inner Dark Coffee Surface -->
    <ellipse cx="50" cy="44.5" rx="19" ry="4" fill="#3D1A14" />
    <ellipse cx="50" cy="44.5" rx="14" ry="2.5" fill="#200D09" />

    <!-- Cup Handle -->
    <path d="M70 48 C78 48 83 54 83 62 C83 69 77 73 67 73" fill="none" stroke="url(#roastRed)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Rising Dynamic Kinetic Steam Plumes -->
    <path d="M42 36 C39 30 44 24 41 18" fill="none" stroke="url(#steamCream)" stroke-width="3" stroke-linecap="round" />
    <path d="M50 34 C47 27 53 22 50 15" fill="none" stroke="url(#steamCream)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M58 36 C61 30 56 24 59 18" fill="none" stroke="url(#steamCream)" stroke-width="3" stroke-linecap="round" />

    <!-- Energy Spark Accent -->
    <polygon points="50,11 52,14 55,14 53,16 54,19 50,17 46,19 47,16 45,14 48,14" fill="#FFE3A8" />
  </g>
</svg>
