<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FFA8" />
      <stop offset="50%" stop-color="#C4F274" />
      <stop offset="100%" stop-color="#80B824" />
    </linearGradient>
    <radialGradient id="forestDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121A15" />
      <stop offset="100%" stop-color="#050806" />
    </radialGradient>
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C4F274" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#forestDark)" stroke="#C4F274" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Biophilic Kettlebell & Kinetic Wave -->
  <g filter="url(#limeGlow)">
    <!-- Kettlebell Handle Arch -->
    <path d="M34 40 C34 26 66 26 66 40" fill="none" stroke="url(#limeGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Kettlebell Body -->
    <circle cx="50" cy="56" r="22" fill="none" stroke="url(#limeGrad)" stroke-width="3.5" />
    <!-- Dynamic Kinetic Pulse Wave Center -->
    <path d="M36 56 L44 56 L48 48 L52 64 L56 56 L64 56" fill="none" stroke="#E2FFA8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
