<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6F9FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#091A22" />
      <stop offset="100%" stop-color="#04090C" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F0FF" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#cyberBg)" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Cyber Kinetic Telemetry ECG & Lightning Core -->
  <g filter="url(#cyanGlow)">
    <!-- ECG Bio Wave -->
    <path d="M18 50 L34 50 L42 26 L50 74 L58 38 L66 58 L72 50 L82 50" fill="none" stroke="url(#pulseCyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Spark Nodes -->
    <circle cx="42" cy="26" r="3" fill="#FFFFFF" />
    <circle cx="50" cy="74" r="3" fill="#00F0FF" />
    <circle cx="58" cy="38" r="2.5" fill="#A6F9FF" />
  </g>
</svg>
