<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A882" />
      <stop offset="50%" stop-color="#C37854" />
      <stop offset="100%" stop-color="#874828" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4F274" />
      <stop offset="100%" stop-color="#7EA644" />
    </linearGradient>
    <radialGradient id="earthBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261A14" />
      <stop offset="100%" stop-color="#0F0A08" />
    </radialGradient>
    <filter id="terraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C37854" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#earthBg)" stroke="#C37854" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Eco Sneaker Silhouette & Organic Leaf Sole -->
  <g filter="url(#terraGlow)">
    <!-- Sneaker Upper Profile -->
    <path d="M22 62 C26 50 36 44 48 44 C56 44 62 36 68 36 C74 36 78 40 78 48 C78 54 82 56 84 62 C74 65 32 65 22 62 Z" fill="none" stroke="url(#terracottaGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Natural Cushion Sole Base -->
    <path d="M20 64 C35 64 65 64 86 64 C86 70 80 74 72 74 C50 74 32 74 20 72 Z" fill="url(#terracottaGrad)" opacity="0.85" />
