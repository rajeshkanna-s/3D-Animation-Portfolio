    <!-- Sole Lug Matrix Dots -->
    <circle cx="34" cy="69" r="1.8" fill="#14100E" />
    <circle cx="46" cy="69" r="1.8" fill="#14100E" />
    <circle cx="58" cy="69" r="1.8" fill="#14100E" />
