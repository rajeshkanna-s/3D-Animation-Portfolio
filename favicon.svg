<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <radialGradient id="hubBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="70%" stop-color="#090C15" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>
    <filter id="cubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6366F1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Indigo Rim -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#hubBg)" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- 3D Isometric Floating Cube Prism -->
  <g filter="url(#cubeGlow)" transform="translate(50, 48)">
    <!-- Top Face -->
    <polygon points="0,-26 24,-13 0,0 -24,-13" fill="url(#cubeTop)" />
    
    <!-- Left Face -->
    <polygon points="-24,-13 0,0 0,26 -24,13" fill="url(#cubeLeft)" />
    
    <!-- Right Face -->
    <polygon points="24,-13 0,0 0,26 24,13" fill="url(#cubeRight)" />

    <!-- Corner/Edge Accent Highlights -->
    <line x1="0" y1="0" x2="0" y2="26" stroke="#C7D2FE" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="0" y1="0" x2="-24" y2="-13" stroke="#E0E7FF" stroke-width="1" stroke-opacity="0.7" />
    <line x1="0" y1="0" x2="24" y2="-13" stroke="#E0E7FF" stroke-width="1" stroke-opacity="0.7" />

    <!-- Core Dynamic Energy Orbit -->
    <ellipse cx="0" cy="0" rx="33" ry="14" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.85" transform="rotate(-15)" />
    <circle cx="28" cy="-8" r="2.2" fill="#38BDF8" />
  </g>
</svg>
