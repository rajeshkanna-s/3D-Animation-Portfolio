      <stop offset="0%" stop-color="#E2F9FF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>
    <linearGradient id="solarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
