    <radialGradient id="novaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A141A" />
      <stop offset="100%" stop-color="#05080A" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F0FF" flood-opacity="0.8"/>
