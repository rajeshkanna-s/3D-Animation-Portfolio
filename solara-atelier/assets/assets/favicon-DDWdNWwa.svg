<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="solaraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="40%" stop-color="#E5C378" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6A28" />
    </linearGradient>
    <radialGradient id="solaraBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#241B13" />
      <stop offset="60%" stop-color="#120D08" />
      <stop offset="100%" stop-color="#070503" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E5C378" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#solaraBg)" stroke="url(#solaraGold)" stroke-width="2.5" />

  <!-- Horological Sunburst & Timepiece -->
  <g filter="url(#goldGlow)" transform="translate(50,50)">
    <!-- Outer Solar Bezel -->
    <circle r="30" fill="none" stroke="url(#solaraGold)" stroke-width="1.8" stroke-dasharray="3.5 4.35" opacity="0.8" />
    <circle r="25" fill="none" stroke="url(#solaraGold)" stroke-width="2.5" />

    <!-- 12-Hour Diamond Marker -->
    <polygon points="0,-21 3,-25 0,-29 -3,-25" fill="#FFF2D6" />
    
    <!-- 3, 6, 9 Hour Subtle Markers -->
    <circle cx="21" cy="0" r="1.8" fill="#E5C378" />
    <circle cx="0" cy="21" r="1.8" fill="#E5C378" />
    <circle cx="-21" cy="0" r="1.8" fill="#E5C378" />

    <!-- Luxury Watch Hands at 10:10 -->
    <!-- Hour Hand pointing towards 10 -->
    <line x1="0" y1="0" x2="-11" y2="-11" stroke="url(#solaraGold)" stroke-width="3" stroke-linecap="round" />
    <!-- Minute Hand pointing towards 2 -->
    <line x1="0" y1="0" x2="15" y2="-9" stroke="url(#solaraGold)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Center Sun Pivot -->
    <circle cx="0" cy="0" r="4.2" fill="url(#solaraGold)" />
    <circle cx="0" cy="0" r="1.6" fill="#0E0C0A" />
  </g>
</svg>
