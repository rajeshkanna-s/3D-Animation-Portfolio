<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7D4D2" />
      <stop offset="50%" stop-color="#5F8180" />
      <stop offset="100%" stop-color="#275150" />
    </linearGradient>
    <radialGradient id="deepOcean" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#193332" />
      <stop offset="100%" stop-color="#081413" />
    </radialGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5F8180" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#deepOcean)" stroke="#5F8180" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Droplet & Concentric Tidal Waves -->
  <g filter="url(#waveGlow)">
    <!-- Tidal Wave Arc 1 -->
    <path d="M26 62 C34 52 42 52 50 62 C58 72 66 72 74 62" fill="none" stroke="url(#oceanGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tidal Wave Arc 2 -->
    <path d="M22 72 C32 62 42 62 50 72 C58 82 68 82 78 72" fill="none" stroke="url(#oceanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Mineral Serum Droplet -->
    <path d="M50 20 C42 34 36 44 36 52 C36 60 42 66 50 66 C58 66 64 60 64 52 C64 44 58 34 50 20 Z" fill="url(#oceanGrad)" opacity="0.9" />
    <!-- Droplet Highlight -->
    <circle cx="47" cy="48" r="2.5" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
